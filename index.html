<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MHWs 会心率計算ツール</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- 自分で書くCSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container py-4 py-md-5">

    <!-- タイトル -->
    <header class="text-center mb-4">
      <h1 class="fw-bold">MHWs 会心率計算ツール</h1>
      <p class="text-body-secondary mb-0">
        武器とスキルから会心率を計算します
      </p>
    </header>


    <!-- 武器 -->
    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h4 card-title">武器</h2>

        <div class="input-group weapon-input">
          <input
            type="number"
            id="weapon-critical-rate"
            class="form-control"
            value="0"
            min="-20"
            max="50"
          >
          <span class="input-group-text">%</span>
        </div>
      </div>
    </section>


    <!-- スキル -->
    <section class="card shadow-sm mb-4">
      <div class="card-body">

        <h2 class="h4 card-title mb-4">スキル</h2>

        <div id="skill-list"></div>

      </div>
    </section>


    <!-- 戦闘中の状態 -->
    <section class="card shadow-sm mb-4">
      <div class="card-body">

        <h2 class="h4 card-title mb-3">戦闘中の状態</h2>

        <div id="battle-state-list"></div>

      </div>
    </section>


    <!-- リセット -->
    <div class="text-center mb-4">
      <button
        id="reset-button"
        class="btn btn-outline-secondary"
      >
        リセット
      </button>
    </div>

  </main>


  <!-- 会心率固定表示 -->
  <section class="result-bar">
    <div class="result-bar-inner">
      <span class="result-label"></span>
      <p id="total-critical-rate" class="mb-0">
        合計会心率：0%
      </p>
    </div>
  </section>


  <script src="script.js"></script>
</body>
</html>
