<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHWs 会心率計算ツール</title>
</head>

<body>
  <h1>MHWs 会心率計算ツール</h1>
<section>
  <h2>武器</h2>
  <input
    type="number"
    id="weapon-critical-rate"
    value="0"
    min="-20"
    max="50"
  >
  <span>%</span>
</section>

<section>
  <h2>スキル</h2>
  <div id="skill-list"></div>
</section>

<section>
  <h2>戦闘中の状態</h2>
  <div id="battle-state-list"></div>
</section>

<section>
  <button id="reset-button">リセット</button>
</section>

<section>
  <h2>会心率</h2>
  <p id="total-critical-rate">会心率：0%</p>
</section>

<script src="script.js"></script>
</body>
</html>
