<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHWs 会心率計算ツール</title>
</head>

<body>
  <h1>MHWs 会心率計算ツール</h1>
<section>
  <h2>武器</h2>
  <p id="weapon-critical-rate">会心率：30%</p>
</section>

<section>
  <h2>スキル</h2>

  <div class="skill">
    <span class="skill-name">見切り</span>
    <button class="level-down-button">ー</button>
    <span class="skill-level">Lv4</span>
    <button class="level-up-button">＋</button>
    <span class="skill-rate">+16%</span>
  </div>

  <div class="skill">
    <span class="skill-name">弱点特効</span>
    <button class="level-down-button">ー</button>
    <span class="skill-level">Lv3</span>
    <button class="level-up-button">＋</button>
    <span class="skill-rate">+15%</span>
  </div>
</section>

<section>
  <h2>会心率</h2>
  <p id="total-critical-rate">会心率：61%</p>
</section>

<script src="script.js"></script>
</body>
</html>
